name: Publikacja JDM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-jdm
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: vars.JDM_DEPLOY_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JDM_HOST: web16.jdm.pl
      JDM_PORT: '2233'
      JDM_USER: lombardg
      JDM_PATH: /home/lombardg/public_html
      JDM_PASSWORD: ${{ secrets.JDM_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Sprawdź konfigurację
        id: configuration
        run: |
          test -n "$JDM_PASSWORD" || { echo 'Brak sekretu JDM_PASSWORD'; exit 1; }
          test -s config/jdm_known_hosts
          python3 - <<'PY'
          import os, re
          path = os.environ['JDM_PATH']
          if not re.fullmatch(r'/[A-Za-z0-9_./-]+', path) or '..' in path.split('/') or path.rstrip('/') in ('', '/home', '/var', '/var/www'):
              raise SystemExit('Ustaw JDM_PATH na sprawdzony, bezwzględny katalog domeny.')
          PY
      - name: Odśwież ceny, zbuduj i sprawdź stronę
        id: build
        run: |
          {
            python3 scripts/update_prices.py
            python3 scripts/export.py
            python3 -m unittest discover -s tests -q
            mkdir -p dist/public
            python3 -m zipfile -e dist/lombard-gorzow.zip dist/public
            rm dist/public/WDROZENIE.txt
            printf '%s\n' "$GITHUB_SHA" > dist/public/deployment-version.txt
          } 2>&1 | tee "$RUNNER_TEMP/jdm-build.txt"
      - name: Przygotuj połączenie SSH
        id: ssh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass rsync
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          cp config/jdm_known_hosts "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Wyślij stronę na JDM
        id: upload
        env:
          SSHPASS: ${{ secrets.JDM_PASSWORD }}
        run: bash scripts/deploy_jdm.sh 2>&1 | tee "$RUNNER_TEMP/jdm-upload.txt"
      - name: Potwierdź pliki na serwerze
        env:
          SSHPASS: ${{ secrets.JDM_PASSWORD }}
        run: |
          sshpass -e ssh -T -p "$JDM_PORT" -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            "$JDM_USER@$JDM_HOST" "cd '$JDM_PATH' && printf 'Wersja na dysku JDM: ' && cat deployment-version.txt && ls -l index.html .htaccess && if test -f index.php; then ls -l index.php; fi" | tee "$RUNNER_TEMP/jdm-server.txt"
      - name: Sprawdź publiczną wersję
        run: python3 -u scripts/verify_jdm.py | tee "$RUNNER_TEMP/jdm-public.txt"
      - name: Zapisz wynik dla Codexa
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_STATUS: ${{ job.status }}
          DEPLOY_STEPS: ${{ toJSON(steps) }}
        run: python3 scripts/publish_jdm_status.py
